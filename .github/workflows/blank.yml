name: 🚀 Build PRIME SAJU APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2️⃣ Install unzip
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      # 3️⃣ 🔥 AUTO FIND ZIP + EXTRACT
      - name: Extract project zip
        run: |
          rm -rf extracted
          mkdir extracted

          ZIPFILE=$(ls *.zip | head -n 1)

          echo "Using ZIP: $ZIPFILE"

          if [ -z "$ZIPFILE" ]; then
            echo "❌ No ZIP file found in repo root"
            exit 1
          fi

          unzip -o "$ZIPFILE" -d extracted
          ls -la extracted

      # 4️⃣ Setup Java 17
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 5️⃣ Setup Gradle (wrapper ছাড়াই build হবে)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2

      # 6️⃣ Build APK
      - name: Build Debug APK
        working-directory: extracted
        run: gradle assembleDebug

      # 7️⃣ Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-SAJU-SENSI-APK
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
