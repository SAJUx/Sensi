name: Build Ayra AI APK (Auto Unzip + Build)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # =========================
    # 1. Checkout repo
    # =========================
    - name: Checkout repository
      uses: actions/checkout@v4

    # =========================
    # 2. Install unzip
    # =========================
    - name: Install unzip
      run: sudo apt-get update && sudo apt-get install -y unzip

    # =========================
    # 3. Unzip your Ayra project
    # =========================
    - name: Extract project zip
      shell: bash
      run: |
        set -e

        # 🔥 YOUR ZIP NAME HERE
        ZIP_FILE="AyraAI_FinalHuman_StyleBlueEyepatch.zip"

        OUT_DIR="extracted"

        rm -rf "$OUT_DIR"
        mkdir -p "$OUT_DIR"

        echo "Unzipping $ZIP_FILE ..."
        unzip -q "$ZIP_FILE" -d "$OUT_DIR"

        echo "Searching for settings.gradle.kts ..."

        SETTINGS=$(find "$OUT_DIR" -type f -name "settings.gradle.kts" | head -n 1)

        if [ -z "$SETTINGS" ]; then
          echo "❌ settings.gradle.kts not found!"
          exit 1
        fi

        PROJECT_DIR=$(dirname "$SETTINGS")

        echo "✅ Project root detected: $PROJECT_DIR"

        echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

    # =========================
    # 4. Setup Java 17
    # =========================
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # =========================
    # 5. Setup Gradle 8.2 (VERY IMPORTANT)
    # =========================
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: "8.2"

    # =========================
    # 6. Build APK
    # =========================
    - name: Build Debug APK
      shell: bash
      run: |
        set -e
        cd "$PROJECT_DIR"

        echo "Gradle version:"
        gradle --version

        gradle assembleDebug --no-configuration-cache --stacktrace

    # =========================
    # 7. Upload APK
    # =========================
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ayra-AI-debug-apk
        path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
