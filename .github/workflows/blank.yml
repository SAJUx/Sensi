name: Android CI (Auto Unzip + Build APK)

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # checkout repo
      - uses: actions/checkout@v4

      # unzip install
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      # 🔥 AUTO FIND ZIP + EXTRACT
      - name: Extract project zip
        run: |
          rm -rf extracted
          mkdir -p extracted

          ZIPFILE=$(ls *.zip | head -n 1)

          echo "Found ZIP: $ZIPFILE"

          if [ -z "$ZIPFILE" ]; then
            echo "❌ No ZIP file found in repo root!"
            exit 1
          fi

          unzip -o "$ZIPFILE" -d extracted
          ls -la extracted

      # Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Gradle install (wrapper লাগবে না)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      # 🔥 BUILD APK
      - name: Build Debug APK
        working-directory: extracted
        run: gradle assembleDebug

      # upload apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PRIME-SAJU-APP-DEBUG
          path: extracted/app/build/outputs/apk/debug/app-debug.apk
